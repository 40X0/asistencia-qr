<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Asistencia QR</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#0B3B3F">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="topbar">
  <div class="brand"><span class="dot"></span> Asistencia QR</div>
  <nav>
    <a href="admin.html">Panel admin</a>
    <button class="link" id="btn-logout" hidden>Salir</button>
  </nav>
</div>

<div class="wrap">

  <!-- LOGIN -->
  <div class="card" id="login-screen">
    <h1>Ingresar</h1>
    <p class="hint">Usa el correo y contraseña del encargado (creado en Firebase).</p>
    <label for="login-email">Correo</label>
    <input type="email" id="login-email" autocomplete="username">
    <label for="login-pass">Contraseña</label>
    <input type="password" id="login-pass" autocomplete="current-password">
    <button class="btn" id="btn-login">Ingresar</button>
    <div id="login-error" class="error-msg" hidden></div>
  </div>

  <!-- APP -->
  <div id="app-screen" hidden>

    <div class="card">
      <h1>Escanear carnet</h1>
      <p class="hint">Apunta la cámara al código QR del estudiante.</p>
      <div id="reader"></div>
      <button class="btn" id="btn-toggle-scan">Iniciar cámara</button>

      <div id="result" class="result-box" hidden>
        <div class="icon" id="result-icon"></div>
        <div class="name" id="result-name"></div>
        <div class="sub" id="result-sub"></div>
      </div>
    </div>

    <div class="card">
      <h2>Registrados hoy (<span id="hoy-fecha"></span>)</h2>
      <div id="lista-hoy"><p class="hint">Aún no hay registros hoy.</p></div>
    </div>

  </div>

</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<script>
const loginScreen = document.getElementById('login-screen');
const appScreen = document.getElementById('app-screen');
const btnLogout = document.getElementById('btn-logout');
const loginError = document.getElementById('login-error');

document.getElementById('btn-login').addEventListener('click', () => {
  loginError.hidden = true;
  const email = document.getElementById('login-email').value.trim();
  const pass = document.getElementById('login-pass').value;
  auth.signInWithEmailAndPassword(email, pass).catch(err => {
    loginError.textContent = 'No se pudo ingresar: ' + traducirError(err.code);
    loginError.hidden = false;
  });
});

btnLogout.addEventListener('click', () => auth.signOut());

function traducirError(code){
  const map = {
    'auth/invalid-email': 'correo inválido',
    'auth/user-not-found': 'usuario no existe',
    'auth/wrong-password': 'contraseña incorrecta',
    'auth/invalid-credential': 'credenciales incorrectas',
    'auth/too-many-requests': 'demasiados intentos, espera un momento'
  };
  return map[code] || code;
}

auth.onAuthStateChanged(user => {
  if(user){
    loginScreen.hidden = true;
    appScreen.hidden = false;
    btnLogout.hidden = false;
  } else {
    loginScreen.hidden = false;
    appScreen.hidden = true;
    btnLogout.hidden = true;
    if(html5QrCode && scanning) stopScan();
  }
});

// ---------- Fecha ----------
function hoyStr(){
  const d = new Date();
  const yyyy = d.getFullYear();
  const mm = String(d.getMonth()+1).padStart(2,'0');
  const dd = String(d.getDate()).padStart(2,'0');
  return `${yyyy}-${mm}-${dd}`;
}
function horaStr(){
  const d = new Date();
  return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}
document.getElementById('hoy-fecha').textContent = hoyStr();

// ---------- Escáner ----------
let html5QrCode = null;
let scanning = false;
let processing = false;

const btnToggle = document.getElementById('btn-toggle-scan');
btnToggle.addEventListener('click', () => {
  if(!scanning) startScan(); else stopScan();
});

function startScan(){
  html5QrCode = new Html5Qrcode("reader");
  const config = { fps: 10, qrbox: { width: 240, height: 240 } };
  html5QrCode.start({ facingMode: "environment" }, config, onScanSuccess)
    .then(() => {
      scanning = true;
      btnToggle.textContent = "Detener cámara";
    })
    .catch(err => {
      alert("No se pudo abrir la cámara: " + err);
    });
}

function stopScan(){
  if(html5QrCode){
    html5QrCode.stop().then(() => html5QrCode.clear()).catch(()=>{});
  }
  scanning = false;
  btnToggle.textContent = "Iniciar cámara";
}

function onScanSuccess(decodedText){
  if(processing) return;
  processing = true;
  const dni = decodedText.trim();
  registrarAsistencia(dni);
}

async function registrarAsistencia(dni){
  const resultBox = document.getElementById('result');
  const icon = document.getElementById('result-icon');
  const name = document.getElementById('result-name');
  const sub = document.getElementById('result-sub');
  resultBox.hidden = false;

  try {
    const alumnoSnap = await db.collection('alumnos').doc(dni).get();
    if(!alumnoSnap.exists){
      resultBox.className = 'result-box error';
      icon.textContent = '⚠️';
      name.textContent = 'DNI no encontrado';
      sub.textContent = 'Este código no corresponde a ningún alumno registrado.';
      liberarEnUnMomento();
      return;
    }

    const alumno = alumnoSnap.data();
    const fecha = hoyStr();
    const docId = `${dni}_${fecha}`;
    const asisRef = db.collection('asistencias').doc(docId);
    const asisSnap = await asisRef.get();

    if(asisSnap.exists){
      const data = asisSnap.data();
      resultBox.className = data.estado === 'justificado' ? 'result-box warn' : 'result-box ok';
      icon.textContent = data.estado === 'justificado' ? '📝' : '✅';
      name.textContent = alumno.nombre;
      sub.textContent = `Ya estaba registrado hoy a las ${data.hora} (${data.estado}).`;
      liberarEnUnMomento();
      return;
    }

    await asisRef.set({
      dni: dni,
      nombre: alumno.nombre,
      fecha: fecha,
      hora: horaStr(),
      estado: 'presente',
      timestamp: firebase.firestore.FieldValue.serverTimestamp()
    });

    resultBox.className = 'result-box ok';
    icon.textContent = '✅';
    name.textContent = alumno.nombre;
    sub.textContent = `Asistencia registrada a las ${horaStr()}.`;
    liberarEnUnMomento();

  } catch(e){
    resultBox.className = 'result-box error';
    icon.textContent = '⚠️';
    name.textContent = 'Error al registrar';
    sub.textContent = e.message;
    liberarEnUnMomento();
  }
}

function liberarEnUnMomento(){
  setTimeout(() => { processing = false; }, 2500);
}

// ---------- Lista de hoy en tiempo real ----------
let unsubscribeHoy = null;
auth.onAuthStateChanged(user => {
  if(user){
    const fecha = hoyStr();
    unsubscribeHoy = db.collection('asistencias')
      .where('fecha', '==', fecha)
      .onSnapshot(snap => {
        const cont = document.getElementById('lista-hoy');
        if(snap.empty){
          cont.innerHTML = '<p class="hint">Aún no hay registros hoy.</p>';
          return;
        }
        const rows = [];
        snap.forEach(doc => {
          const d = doc.data();
          rows.push({ nombre: d.nombre, hora: d.hora, estado: d.estado });
        });
        rows.sort((a,b) => b.hora.localeCompare(a.hora));
        cont.innerHTML = rows.map(r => `
          <div class="list-row">
            <span>${r.nombre}</span>
            <span>
              <span class="badge ${r.estado}">${r.estado}</span>
              <span style="color:var(--muted); margin-left:8px;">${r.hora}</span>
            </span>
          </div>
        `).join('');
      });
  } else if(unsubscribeHoy){
    unsubscribeHoy();
  }
});
</script>

</body>
</html>
